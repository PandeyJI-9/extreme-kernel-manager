# Gradle and Kotlin Memory Configuration for CI / Production
org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
kotlin.daemon.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m

# Build Performance Flags
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false

# Android & Kotlin Optimizations
android.useAndroidX=true
android.enableJetifier=false
kotlin.incremental=false
ksp.incremental=false
