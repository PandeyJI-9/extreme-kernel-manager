name: Build Extreme+ Kernel Manager (EKM)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.1.0-beta3)'
        required: false
        default: 'v2.1.0-beta3'
      publish_release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: true
      send_telegram:
        description: 'Send Telegram Broadcast'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build & Sign EKM Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx3584m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC' -Dfile.encoding=UTF-8"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Check Runner System Resources
        run: |
          free -h
          df -h

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚡ Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🏗️ Compile Release APK
        run: ./gradlew assembleRelease -x test -x lint --stacktrace

      - name: 📄 Upload Build Error Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            app/build/reports/
            ~/.gradle/daemon/

      - name: 🔑 Sign Release APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::Release APK not found!"
            exit 1
          fi
          
          mkdir -p signed_out
          SIGNED_APK="signed_out/EKM-Extreme-Kernel-Manager-Release.apk"
          
          ANDROID_BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_BUILD_TOOLS/apksigner"
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with provided production Keystore Secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            $APKSIGNER sign --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "$SIGNED_APK" \
              "$UNSIGNED_APK"
            rm -f release.keystore
          else
            echo "No custom keystore secret detected. Generating self-signed release key..."
            keytool -genkeypair -v \
              -keystore temp.keystore \
              -alias extreme \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Extreme Kernel Manager, OU=Extreme, O=Extreme, L=Munch, ST=SM8250, C=IN"
              
            $APKSIGNER sign --ks temp.keystore \
              --ks-key-alias extreme \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$SIGNED_APK" \
              "$UNSIGNED_APK"
            rm -f temp.keystore
          fi
          
          # Verify APK Signature
          $APKSIGNER verify --verbose "$SIGNED_APK"
          
          # Extract metadata
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2 || echo "2.1.0-beta1")
          FINAL_NAME="EKM-Extreme-Kernel-Manager-v${VERSION_NAME}.apk"
          mv "$SIGNED_APK" "signed_out/$FINAL_NAME"
          echo "FINAL_APK_PATH=signed_out/$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "FINAL_APK_NAME=$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: 📦 Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign_apk.outputs.FINAL_APK_NAME }}
          path: ${{ steps.sign_apk.outputs.FINAL_APK_PATH }}
          retention-days: 30

      - name: 🏷️ Determine Tag for Release
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v${{ steps.sign_apk.outputs.VERSION_NAME }}" >> $GITHUB_OUTPUT
          fi

      - name: 📢 Create GitHub Release
        if: steps.sign_apk.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_tag.outputs.TAG }}"
          APK_PATH="${{ steps.sign_apk.outputs.FINAL_APK_PATH }}"
          
          # Delete existing release for this tag if it already exists to avoid API collisions
          gh release delete "$TAG" -y 2>/dev/null || true
          
          cat << 'EOF' > release_notes.md
          ## 🚀 Extreme+ Kernel Manager (EKM) - Beta Testing Release
          
          Engineered exclusively for **POCO F4 (`munch` / SM8250)** running **EXTREME++ Kernel by PandeyJI-9**.
          
          ### ✨ Highlights:
          * **⚡ Extreme+ Native Governor**: Integrated support and prioritisation for custom `extreme+` CPU governor.
          * **⚡ Tri-Profile Engine**: Dynamic Profile Switcher (Battery Saver 2.42GHz, Balanced Cruise 2.84GHz, Apex Turbo 3.19GHz).
          * **🛡️ Dual-Tier Engine**: 100% rootless telemetry launch; root is requested strictly on-demand when tweaking parameters.
          * **🌙 Hardware DC Dimming**: E4 AMOLED native Munch DSI/DRM registers controller + QS Tile.
          * **📊 Live Telemetry**: Adreno 650 GPU, CPU per-core frequencies, L3 cache priority locks.
          
          ### 👑 Developer:
          * **PandeyJi** ([@PandeyJi_8](https://t.me/PandeyJi_8) • [@PandeyJI-9](https://github.com/PandeyJI-9))
          * 💬 Support & Bug Reports: [https://t.me/Extremeplus_Support](https://t.me/Extremeplus_Support)

          ### 📲 Downloads:
          Download the signed APK below and install directly on your device.
          EOF
          
          gh release create "$TAG" "$APK_PATH" \
            --title "EKM $TAG for POCO F4 (EXTREME++) [Beta]" \
            --notes-file release_notes.md \
            --prerelease
          
          echo "GitHub Release published successfully!"

      - name: ✈️ Send Telegram Broadcast
        if: always() && steps.sign_apk.conclusion == 'success' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          APK_PATH="${{ steps.sign_apk.outputs.FINAL_APK_PATH }}"
          FINAL_NAME="${{ steps.sign_apk.outputs.FINAL_APK_NAME }}"
          TAG="${{ steps.release_tag.outputs.TAG }}"
          FILE_SIZE=$(stat -c%s "$APK_PATH")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1048576}")
          DOWNLOAD_URL="https://github.com/PandeyJI-9/extreme-kernel-manager/releases/download/${TAG}/${FINAL_NAME}"
          
          CAPTION=$(printf '%s\n' \
            "🚀 <b>Extreme+ Kernel Manager (EKM)</b> [Beta Testing]" \
            "" \
            "📱 <b>Device:</b> POCO F4 (munch / SM8250)" \
            "⚡ <b>Target Kernel:</b> EXTREME++ by PandeyJi" \
            "👑 <b>Dev:</b> @PandeyJi_8 | github.com/PandeyJI-9" \
            "💬 <b>Support Group:</b> t.me/Extremeplus_Support" \
            "🏷️ <b>Release:</b> ${TAG} (${FILE_SIZE_MB} MB)" \
            "" \
            "🔥 <b>Features:</b>" \
            "• Dynamic Tri-Profile Engine (extreme+ Governor)" \
            "• Hardware DC Dimming QS Tile" \
            "• Dual-Tier Rootless/Root Architecture" \
            "• Universal Handshake & Hardware Magic")
          
          HTTP_CODE=""
          BODY=""
          
          # Telegram Bot API sendDocument limit is 50MB (50000000 bytes)
          if [ "$FILE_SIZE" -lt 50000000 ]; then
            echo "APK is ${FILE_SIZE_MB} MB (<50MB). Uploading document directly to Telegram..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"${APK_PATH}" \
              -F caption="${CAPTION}" \
              -F parse_mode="HTML")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "Telegram sendDocument status: $HTTP_CODE"
            echo "Telegram response: $BODY"
          else
            echo "APK is ${FILE_SIZE_MB} MB (>=50MB limit). Using rich announcement with direct download link..."
            HTTP_CODE="413"
          fi
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Executing Telegram broadcast with Direct APK Download Link..."
            MSG=$(printf '%s\n' \
              "🚀 <b>Extreme+ Kernel Manager (EKM)</b> [Beta Testing]" \
              "" \
              "📱 <b>Device:</b> POCO F4 (munch / SM8250)" \
              "⚡ <b>Target Kernel:</b> EXTREME++ by PandeyJi" \
              "👑 <b>Dev:</b> @PandeyJi_8 | github.com/PandeyJI-9" \
              "💬 <b>Support Group:</b> t.me/Extremeplus_Support" \
              "🏷️ <b>Release:</b> ${TAG} (${FILE_SIZE_MB} MB)" \
              "" \
              "🔥 <b>Features:</b>" \
              "• Dynamic Tri-Profile Engine (extreme+ Governor)" \
              "• Hardware DC Dimming QS Tile" \
              "• Dual-Tier Rootless/Root Architecture" \
              "• Universal Handshake & Hardware Magic" \
              "" \
              "📥 <b>Direct APK Download:</b>" \
              "<a href=\"${DOWNLOAD_URL}\">⚡ Click Here to Download ${FINAL_NAME}</a>")
            
            FALLBACK_RESP=$(curl -s -w "\n%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=false")
              
            FB_CODE=$(echo "$FALLBACK_RESP" | tail -n 1)
            FB_BODY=$(echo "$FALLBACK_RESP" | head -n -1)
            echo "Telegram sendMessage status: $FB_CODE"
            echo "Telegram response: $FB_BODY"
          else
            echo "Telegram document broadcast sent successfully!"
          fi
